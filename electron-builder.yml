# Installer packaging (spec runtimes/electron.md §Packaging and installers).
# Internal identity (D-034): appId and nsis.guid are brand-independent and must NEVER change,
# so installs keep upgrading in place even if the product is renamed. Only display names use the brand.
appId: io.github.richarddlarson.cardtable
productName: FreeKards
copyright: Copyright (c) 2026 The FreeKards Contributors
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*.cjs
  - dist/renderer/**/*
  - package.json
extraResources:
  - from: sbom
    to: sbom
  - from: LICENSE
    to: LICENSE.FreeKards.txt
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  guid: 603b3361-eb1a-4e18-9d18-ef44b2392b21
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: FreeKards
  license: LICENSE

linux:
  executableName: freekards
  # Icon set 16–512 px (D-067): Debian/Mint's hicolor theme has no 1024 folder. Made by `npm run icon`.
  icon: build/icons
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Game
  maintainer: The FreeKards Contributors
  synopsis: Classic card games with friendly computer opponents
deb:
  packageCategory: games
  # Brand-visible .deb name (D-043). Installers show it ("freekards 0.1.0 is now installed").
  # A future rename keeps upgrades working via Debian replaces/conflicts on the old name, as below.
  packageName: freekards
  fpm:
    - --replaces=cardtable
    - --conflicts=cardtable
